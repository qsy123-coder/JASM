# This workflow will build and publish a WinUI 3 unpackaged desktop application
# built on .NET.

name: Build And Release JASM Self Contained

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]
        platform: [x64]

    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.x

    - name: Test
      run: dotnet test ${{ github.workspace }}\src

    # 不传 ExcludeElevator：自包含版同样需要提权助手（理由见 dotnet-desktop.yml 的同一处注释）。
    # Release.py 的构建门就是「非 ExcludeElevator」，助手会被构建并复制到包内、同时内嵌进主 exe。
    #
    # 下面的 MSVC 探测与 IlcUseEnvironmentalTools 与 dotnet-desktop.yml 同一块，改动请同步三处
    # （原因：windows-latest 迁到 VS 2026 后 ILCompiler 的 [16,18) 版本范围失效）。
    - name: Build, publish and zip the app
      shell: cmd
      run: |
        set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
        if not exist "%VSWHERE%" (echo vswhere.exe not found & exit /b 1)
        for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
        if not defined VSDIR (echo No Visual Studio with C++ tools found & exit /b 1)
        echo Visual Studio: %VSDIR%
        call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" > nul
        where link || exit /b 1
        set "IlcUseEnvironmentalTools=true"
        python ${{ github.workspace }}\Build\Release.py SelfContained

    # Upload the app
    - name: Upload JASM Self Contained
      uses: actions/upload-artifact@v4
      with:
        name: JASM Self Contained
        path: ${{ github.workspace }}\\${{ env.zipFile }}
        
