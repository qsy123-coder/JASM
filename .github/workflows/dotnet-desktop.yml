# This workflow will build and publish a WinUI 3 unpackaged desktop application
# built on .NET.

name: Test,Build And Release JASM

on:
  workflow_dispatch:

  pull_request:
    branches: [ master ]
    paths:
      - 'src/**'
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'CHANGELOG.md'

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]
        platform: [x64]

    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.x

    - name: Test
      run: dotnet test ${{ github.workspace }}\src

    # 不传 ExcludeElevator：Elevator.exe 必须进包。它是提权刷新（F10）的唯一执行体，
    # 而 AutoUpdater 的 doNotDeleteFiles 只能"保留"旧助手、靠解压覆盖来更新它 ——
    # zip 里没有就永远更新不了，用户手上会一直是 1.0.0.0 的旧版（不认识带目标窗口的新命令）。
    # Elevator 是 AOT 发布，需要 MSVC，只有 windows-latest 跑得动（本机无 MSVC）。
    - name: Build, publish and zip the app
      run: python ${{ github.workspace }}\Build\Release.py
      shell: cmd

    # Upload the app
    - name: Upload JASM
      uses: actions/upload-artifact@v4
      with:
        name: Upload JASM
        path: ${{ github.workspace }}\\${{ env.zipFile }}
        
