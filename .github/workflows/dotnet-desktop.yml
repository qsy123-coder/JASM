# This workflow will build and publish a WinUI 3 unpackaged desktop application
# built on .NET.

name: Test,Build And Release JASM

on:
  workflow_dispatch:

  pull_request:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'Build/**'
      - '.github/workflows/dotnet-desktop.yml'
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'Build/**'
      - 'CHANGELOG.md'
      # 改本 workflow 也要跑一次：打包步骤（如先构建 UHD 映射 DLL）只能靠真实构建验证
      - '.github/workflows/dotnet-desktop.yml'

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]
        platform: [x64]

    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on
    env:
      # 证书没配时跳过签名步骤，PR / fork 构建不应因此失败。
      HAS_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.x

    # 测试失败自动重试一次：xUnit/GDI 相关用例在共享 runner 上偶发失败，
    # 之前每次都要人工点「Re-run failed jobs」。重试仍失败才算失败，不掩盖真实回归。
    - name: Test
      shell: pwsh
      run: |
        dotnet test ${{ github.workspace }}\src
        if ($LASTEXITCODE -ne 0) {
          Write-Host "::warning::测试首次失败，自动重试一次"
          dotnet test ${{ github.workspace }}\src
        }

    # UHD 映射 DLL 必须先于主程序构建：主程序 csproj 用 Exists 条件内嵌
    # src/Jasm.UhdMapper/build/Release/Jasm.UhdMapper.dll（运行时释放到 %LOCALAPPDATA%\JASM\UhdRuntime）。
    # windows-latest 自带 VS + C++ 工作负载，CMake 能直接找到 MSVC。
    - name: Build UHD Mapper DLL
      run: |
        cmake -S src/Jasm.UhdMapper -B src/Jasm.UhdMapper/build -A x64
        cmake --build src/Jasm.UhdMapper/build --config Release

    # 不传 ExcludeElevator：Elevator.exe 必须进包。它是提权刷新（F10）与代发按键的唯一执行体，
    # 而 AutoUpdater 的 doNotDeleteFiles 只能"保留"旧助手、靠解压覆盖来更新它 ——
    # zip 里没有就永远更新不了，用户手上会一直是 1.0.0.0 的旧版（不认识新命令）。
    #
    # 助手是 AOT 发布，需要 MSVC，而 windows-latest 已在 2026-06 迁到 Visual Studio 2026（v18）：
    # net7.0 的 microsoft.dotnet.ilcompiler 把 vswhere 的版本范围钉死在 [16,18)（见其 findvcvarsall.bat），
    # VS 18 落在范围外 → 即便 C++ 工作负载装了也报 "Platform linker not found"。
    # 这里自己跑一遍 vswhere（不带上限）+ vcvars64，再用 IlcUseEnvironmentalTools=true
    # 让 ILCompiler 直接用环境里的 link.exe，绕开它那段过期的版本探测。
    # 注意必须与 python 同一步：env 不跨 step 传递。改回 windows-2022 也能绕过，但那只是把问题推后。
    - name: Build, publish and zip the app
      shell: cmd
      run: |
        set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
        if not exist "%VSWHERE%" (echo vswhere.exe not found & exit /b 1)
        for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
        if not defined VSDIR (echo No Visual Studio with C++ tools found & exit /b 1)
        echo Visual Studio: %VSDIR%
        call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" > nul
        where link || exit /b 1
        set "IlcUseEnvironmentalTools=true"
        python ${{ github.workspace }}\Build\Release.py

    - name: Install Inno Setup
      run: choco install innosetup --no-progress -y

    # 先签负载，再重打 .7z：Release.py 在签名之前就把 output/ 压成了归档，
    # 只签磁盘上的文件会让 .7z 里仍然是未签名字节。
    - name: Sign release payload
      if: env.HAS_SIGNING == 'true'
      uses: azure/trusted-signing-action@v0
      with:
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
        trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
        files-folder: ${{ github.workspace }}\output
        files-folder-filter: exe,dll
        files-folder-recurse: true
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    - name: Rebuild folder archive with signed binaries
      if: env.HAS_SIGNING == 'true'
      shell: pwsh
      run: |
        Remove-Item -LiteralPath "${{ github.workspace }}\${{ env.zipFile }}" -ErrorAction SilentlyContinue
        7z a -mx4 "${{ github.workspace }}\${{ env.zipFile }}" "${{ github.workspace }}\output\*"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        7z h -scrcsha256 "${{ github.workspace }}\${{ env.zipFile }}"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    # 安装包：output/JASM -> JASM_Setup_v<版本>.exe（见 Build/Installer/JASM.iss）
    - name: Build installer
      shell: pwsh
      run: pwsh -NoProfile -File Build/PackInstaller.ps1

    - name: Sign installer
      if: env.HAS_SIGNING == 'true'
      uses: azure/trusted-signing-action@v0
      with:
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
        trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
        files-folder: ${{ github.workspace }}
        files-folder-filter: exe
        files-folder-recurse: false
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    # Upload the app
    - name: Upload JASM
      uses: actions/upload-artifact@v4
      with:
        name: Upload JASM
        path: |
          ${{ github.workspace }}\${{ env.zipFile }}
          ${{ github.workspace }}\JASM_Setup_v*.exe
        
