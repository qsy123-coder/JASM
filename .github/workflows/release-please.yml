name: Release Please Automatic patch notes
on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  main:
    runs-on: ubuntu-24.04
    steps:
      # 用 manifest/config 固定「上一版是 2.35.1」。只写 release-type/package-name 时，
      # action 读不到 csproj 里的 VersionPrefix，会把所有历史提交当成首个版本 → 1.0.0。
      - uses: google-github-actions/release-please-action@v3
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
